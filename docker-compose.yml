# Moodle + MariaDB — local LMS for hands-on administration practice.
# Bitnami images are no longer on Docker Hub (Aug 2025); using maintained alternatives.
#
# Access Moodle: http://localhost:8080
# MariaDB:      localhost:3306 (user: moodle / pass: moodle)

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    volumes:
      - ./docker/mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  moodle:
    image: erseco/alpine-moodle:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SITE_URL: http://localhost:8080
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: moodle
      DB_USER: moodle
      DB_PASS: moodle
      DB_PREFIX: mdl_
      MOODLE_EMAIL: admin@joby.training
      MOODLE_LANGUAGE: en
      MOODLE_SITENAME: Joby Aviation Training LMS
      MOODLE_USERNAME: admin
      MOODLE_PASSWORD: Admin123!
    ports:
      - "8080:8080"
    volumes:
      - ./docker/moodledata:/var/www/moodledata
      - ./docker/moodlehtml:/var/www/html
