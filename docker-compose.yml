# Moodle 4.3 + MySQL 8.0 — local LMS for hands-on administration practice.
# Access Moodle: http://localhost:8080
# MySQL: localhost:3306 (user: moodle / pass: moodle)

services:
  mariadb:
    image: bitnami/mariadb:11.4
    environment:
      - MARIADB_ROOT_PASSWORD=rootpassword
      - MARIADB_USER=moodle
      - MARIADB_PASSWORD=moodle
      - MARIADB_DATABASE=moodle
      - MARIADB_CHARACTER_SET=utf8mb4
      - MARIADB_COLLATE=utf8mb4_unicode_ci
    volumes:
      - ./docker/mysqldata:/bitnami/mariadb
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  moodle:
    image: bitnami/moodle:4.3
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - MOODLE_DATABASE_HOST=mariadb
      - MOODLE_DATABASE_PORT_NUMBER=3306
      - MOODLE_DATABASE_USER=moodle
      - MOODLE_DATABASE_PASSWORD=moodle
      - MOODLE_DATABASE_NAME=moodle
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=Admin123!
      - MOODLE_EMAIL=admin@joby.training
      - MOODLE_SITE_NAME=Joby Aviation Training LMS
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./docker/moodledata:/bitnami/moodledata
